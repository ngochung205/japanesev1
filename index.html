<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>japaneseV1 - Liquid Glass Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e11d48;
      --primary-hover: #be123c;
      --primary-glass: rgba(225, 29, 72, 0.14);
      --primary-glow: rgba(225, 29, 72, 0.35);
      --text: #0f172a;
      --text-muted: #334155;
      --success: #059669;
      
      /* Liquid Glass Constants */
      --glass-bg: rgba(255, 255, 255, 0.62);
      --glass-bg-hover: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.85);
      --glass-border-subtle: rgba(255, 255, 255, 0.55);
      --glass-shadow: 0 16px 36px 0 rgba(15, 23, 42, 0.1), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
      --glass-shadow-hover: 0 20px 42px 0 rgba(225, 29, 72, 0.2), inset 0 1px 2px 0 rgba(255, 255, 255, 1);
      
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* HÌNH NỀN BỨC TRANH 3 CHÚ MÈO CỐ ĐỊNH */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 80px;
      overflow-x: hidden;
      background: #fbcfe8 url('bg.jpg') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    .jp { font-family: 'Noto Sans JP', sans-serif; }

    .glass-backdrop-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: -1;
    }

    /* LIQUID GLASS HEADER */
    header {
      background: rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: all 0.3s;
    }
    .header-inner {
      max-width: 1260px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-logo-img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      padding: 2px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 16px rgba(0,0,0,0.08), inset 0 1px 1px rgba(255,255,255,0.9);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand:hover .brand-logo-img { transform: scale(1.1) rotate(-4deg); }
    .brand-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.6px;
    }
    .brand-name span {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .level-toggle {
      display: flex;
      background: rgba(255, 255, 255, 0.55);
      padding: 4px;
      border-radius: 14px;
      gap: 4px;
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(14px);
    }
    .level-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .level-btn.active {
      background: rgba(255, 255, 255, 0.95);
      color: var(--primary);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08), inset 0 1px 1px #fff;
      transform: translateY(-1px);
    }

    /* TABS */
    main {
      max-width: 1260px;
      margin: 24px auto;
      padding: 0 24px;
    }
    .tabs-bar {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      margin-bottom: 26px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid var(--glass-border);
      border-bottom: none;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 14px 14px 0 0;
      margin-bottom: -1px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.25s ease;
      backdrop-filter: blur(14px);
    }
    .tab-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.7); }
    .tab-btn.active {
      background: rgba(255, 255, 255, 0.85);
      color: var(--primary);
      border-color: var(--glass-border);
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.04), inset 0 1px 1px #fff;
    }
    .tab-badge {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.9);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .tab-btn.active .tab-badge {
      background: #ffe4e6;
      color: var(--primary);
    }

    .tab-pane {
      display: none;
      animation: liquidFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tab-pane.active { display: block; }
    @keyframes liquidFadeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* LIQUID GLASS PANEL */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      box-shadow: var(--glass-shadow);
      margin-bottom: 24px;
    }

    .kana-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .kana-switch-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
      box-shadow: inset 0 1px 1px #fff;
    }
    .pill-btn:hover { background: rgba(255, 255, 255, 0.95); }
    .pill-btn.active {
      background: #0f172a;
      color: #fff;
      border-color: #0f172a;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
    }

    /* KANA GRID */
    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .kana-grid.yoon-grid { grid-template-columns: repeat(3, 1fr); }
    .kana-grid.tokushu-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }

    .kana-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px 8px 12px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .kana-card:hover {
      transform: translateY(-4px) scale(1.02);
      background: var(--glass-bg-hover);
      box-shadow: var(--glass-shadow-hover);
      border-color: #fda4af;
    }
    .kana-card:active { transform: scale(0.94); background: #ffe4e6; }
    .kana-card.empty { background: transparent; border-color: transparent; box-shadow: none; cursor: default; }

    .kana-char {
      font-size: 38px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .kana-card:hover .kana-char { color: var(--primary); }
    .kana-romaji { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .kana-vi {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(225, 29, 72, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
      margin-top: 5px;
      display: inline-block;
      border: 1px solid rgba(225, 29, 72, 0.15);
    }
    .kana-audio-dot { position: absolute; top: 6px; right: 6px; font-size: 11px; opacity: 0.4; }

    /* KANJI GRID */
    .kanji-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .kanji-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--glass-shadow);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      cursor: pointer;
    }
    .kanji-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--glass-shadow-hover);
      border-color: #fda4af;
      background: var(--glass-bg-hover);
    }
    .kanji-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .kanji-main-char {
      font-size: 56px;
      font-weight: 900;
      color: var(--text);
      line-height: 1;
    }
    .kanji-hanviet {
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.35);
    }
    .kanji-details { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
    .kanji-row { display: flex; gap: 6px; }
    .kanji-label { color: var(--text-muted); font-weight: 700; min-width: 54px; }
    .kanji-val { font-weight: 600; color: #1e293b; }
    .kanji-example {
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 12.5px;
      border-left: 3px solid var(--primary);
      border: 1px solid var(--glass-border-subtle);
    }

    /* KHO TỪ VỰNG */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .search-input-wrapper { position: relative; flex: 1; max-width: 380px; }
    .search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px);
      outline: none;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8);
      transition: all 0.25s;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 18px;
    }
    .v-card {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }
    .v-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--glass-shadow-hover);
      background: var(--glass-bg-hover);
    }
    .v-card.learned {
      background: rgba(236, 253, 245, 0.75);
      border-color: #34d399;
    }
    .v-furigana { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .v-kanji { font-size: 30px; font-weight: 900; line-height: 1.2; color: var(--text); }
    .v-meaning { font-size: 14.5px; font-weight: 700; margin-top: 8px; color: #1e293b; }

    .v-actions { display: flex; gap: 8px; }
    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .btn-icon:hover { transform: scale(1.08); background: #fff; }
    .btn-icon.check.active {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
    }
    .page-btn {
      padding: 10px 18px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: var(--glass-shadow);
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) { background: #0f172a; color: #fff; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* TRẮC NGHIỆM */
    .quiz-card {
      max-width: 680px;
      margin: 10px auto;
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 36px 30px;
      box-shadow: var(--glass-shadow);
    }
    .q-main {
      font-size: 46px;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      margin: 14px 0 6px 0;
    }
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }
    .ans-btn {
      padding: 16px 20px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      box-shadow: var(--glass-shadow);
    }
    .ans-btn:hover { background: rgba(255, 255, 255, 0.98); transform: translateY(-2px); }
    .ans-btn.correct { background: #d1fae5 !important; border-color: var(--success) !important; color: #065f46; }
    .ans-btn.wrong { background: #ffe4e6 !important; border-color: var(--primary) !important; color: var(--primary); }
    .btn-next-q {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      margin-top: 26px;
      display: none;
      float: right;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
    }

    /* THỐNG KÊ DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .stat-card {
      background: var(--glass-bg);
      backdrop-filter: blur(26px) saturate(200%);
      -webkit-backdrop-filter: blur(26px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--glass-shadow);
    }
    .stat-header {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-number { font-size: 36px; font-weight: 900; }

    /* TOAST ÂM THANH */
    #audio-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 16px 36px rgba(0,0,0,0.28);
      z-index: 9999;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #audio-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ================================================================= */
    /* --- BÉ CHIIKAWA ÔM HOA ĐƯỢC THU NHỎ 40% (KÍCH THƯỚC COMPACT) --- */
    /* ================================================================= */
    #chiikawa-companion {
      position: fixed;
      width: 47px;
      height: 49px;
      z-index: 9998;
      pointer-events: auto;
      cursor: pointer;
      user-select: none;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.22));
      will-change: left, top;
    }
    .chiikawa-container {
      width: 100%;
      height: 100%;
      transform-origin: center bottom;
      transition: transform 0.28s ease;
    }

    /* ĐỘNG TÁC BƯỚC ĐI CỦA 2 CHÂN */
    .leg-left {
      transform-origin: 58px 146px;
    }
    .leg-right {
      transform-origin: 92px 146px;
    }
    .is-walking .leg-left {
      animation: legStepLeft 0.22s infinite alternate ease-in-out;
    }
    .is-walking .leg-right {
      animation: legStepRight 0.22s infinite alternate-reverse ease-in-out;
    }
    @keyframes legStepLeft {
      0% { transform: rotate(-24deg) translateY(0); }
      100% { transform: rotate(24deg) translateY(-2px); }
    }
    @keyframes legStepRight {
      0% { transform: rotate(24deg) translateY(-2px); }
      100% { transform: rotate(-24deg) translateY(0); }
    }

    /* NHÚN NHẢY THÂN HÌNH KHI BƯỚC CHẠY */
    .is-walking .chiikawa-body {
      animation: waddleBounce 0.22s infinite alternate ease-in-out;
    }
    @keyframes waddleBounce {
      0% { transform: translateY(0px) rotate(-2deg); }
      100% { transform: translateY(-3px) rotate(2deg); }
    }

    /* BONG BÓNG THOẠI CỦA BÉ CHIIKAWA */
    .chiikawa-bubble {
      position: absolute;
      bottom: 104%;
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s;
    }
    .chiikawa-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: rgba(255,255,255,0.96) transparent transparent transparent;
    }
    .chiikawa-bubble.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* HIỆU ỨNG HOA NỞ TẠI ĐIỂM CHẠM MÀN HÌNH */
    .bloom-target {
      position: fixed;
      width: 26px;
      height: 26px;
      z-index: 9996;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 0.95;
      animation: bloomPop 0.8s forwards ease-out;
    }
    @keyframes bloomPop {
      0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 0.9; }
      50% { transform: translate(-50%, -50%) scale(1.2) rotate(45deg); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.6) rotate(90deg); opacity: 0; }
    }

    @media (max-width: 640px) {
      .kana-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; }

  <script>
    // =========================================================================
    // --- 1. CHUYỂN ĐỘNG CHÂN & DI CHUYỂN CỦA BÉ CHIIKAWA ÔM HOA ---
    // =========================================================================
    const chiikawa = document.getElementById('chiikawa-companion');
    const chiikawaContainer = document.getElementById('chiikawa-container');
    const chiikawaBubble = document.getElementById('chiikawa-bubble');

    const chiikawaQuotes = [
      "わァ…！🌸",
      "がんばって！💪",
      "ヤハッ！⭐",
      "えらいッ！✨",
      "フッ…！🐾",
      "お花どうぞ！🌷"
    ];

    let chiikawaX = 40;
    let chiikawaY = window.innerHeight - 100;
    let walkTimeout = null;
    let idleTimer = null;

    chiikawa.style.left = `${chiikawaX}px`;
    chiikawa.style.top = `${chiikawaY}px`;

    function createBloomTarget(x, y) {
      const bloom = document.createElement('div');
      bloom.className = 'bloom-target';
      bloom.style.left = `${x}px`;
      bloom.style.top = `${y}px`;
      bloom.innerHTML = `
        <svg viewBox="0 0 30 30" width="100%" height="100%">
          <circle cx="15" cy="15" r="5" fill="#f43f5e"/>
          <ellipse cx="15" cy="6" rx="4" ry="6" fill="#fbcfe8" opacity="0.9"/>
          <ellipse cx="15" cy="24" rx="4" ry="6" fill="#fbcfe8" opacity="0.9"/>
          <ellipse cx="6" cy="15" rx="6" ry="4" fill="#fbcfe8" opacity="0.9"/>
          <ellipse cx="24" cy="15" rx="6" ry="4" fill="#fbcfe8" opacity="0.9"/>
        </svg>
      `;
      document.body.appendChild(bloom);
      setTimeout(() => bloom.remove(), 800);
    }

    function moveChiikawaTo(targetScreenX, targetScreenY) {
      const companionW = chiikawa.offsetWidth || 47;
      const companionH = chiikawa.offsetHeight || 49;
      const maxX = window.innerWidth - companionW - 10;
      const maxY = window.innerHeight - companionH - 10;

      const destX = Math.min(Math.max(10, targetScreenX - companionW / 2), maxX);
      const destY = Math.min(Math.max(70, targetScreenY - companionH / 2), maxY);

      const dx = destX - chiikawaX;
      const dy = destY - chiikawaY;
      const distance = Math.hypot(dx, dy);

      if (distance < 16) return;

      if (destX < chiikawaX) {
        chiikawaContainer.style.transform = 'scaleX(1)';
      } else {
        chiikawaContainer.style.transform = 'scaleX(-1)';
      }

      const duration = Math.min(Math.max(distance / 380, 0.45), 2.8);
      chiikawa.style.transition = `left ${duration}s cubic-bezier(0.25, 1, 0.5, 1), top ${duration}s cubic-bezier(0.25, 1, 0.5, 1)`;

      chiikawa.classList.add('is-walking');
      chiikawa.style.left = `${destX}px`;
      chiikawa.style.top = `${destY}px`;

      chiikawaX = destX;
      chiikawaY = destY;

      clearTimeout(walkTimeout);
      walkTimeout = setTimeout(() => {
        chiikawa.classList.remove('is-walking');
      }, duration * 1000);
    }

    function onScreenTouch(e) {
      if (e.target.closest('#chiikawa-companion')) return;

      const clickX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : null);
      const clickY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : null);

      if (clickX === null || clickY === null) return;

      createBloomTarget(clickX, clickY);
      moveChiikawaTo(clickX, clickY);
      resetIdleCompanion();
    }

    window.addEventListener('pointerdown', onScreenTouch);

    chiikawa.addEventListener('click', (e) => {
      e.stopPropagation();
      speak('わぁ');

      const quote = chiikawaQuotes[Math.floor(Math.random() * chiikawaQuotes.length)];
      chiikawaBubble.innerText = quote;
      chiikawaBubble.classList.add('show');

      chiikawaContainer.style.transform += ' translateY(-12px) scale(1.15)';
      setTimeout(() => {
        chiikawaBubble.classList.remove('show');
        chiikawaContainer.style.transform = chiikawaContainer.style.transform.replace(' translateY(-12px) scale(1.15)', '');
      }, 1600);

      resetIdleCompanion();
    });

    function idleCompanionWalk() {
      const maxX = Math.max(window.innerWidth - 70, 20);
      const maxY = Math.max(window.innerHeight - 80, 80);
      const nextX = Math.floor(Math.random() * (maxX - 40)) + 20;
      const nextY = Math.floor(Math.random() * (maxY - 120)) + 80;
      moveChiikawaTo(nextX, nextY);
    }

    function resetIdleCompanion() {
      clearInterval(idleTimer);
      idleTimer = setInterval(idleCompanionWalk, 12000);
    }
    resetIdleCompanion();

    // =========================================================================
    // --- 2. HỆ THỐNG PHÁT ÂM TIẾNG NHẬT ĐA NỀN TẢNG ---
    // =========================================================================
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('audio-toast');
      const text = document.getElementById('toast-text');
      text.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function unlockAudioContext() {
      if ('speechSynthesis' in window) window.speechSynthesis.resume();
    }
    document.addEventListener('touchstart', unlockAudioContext, { once: true, passive: true });
    document.addEventListener('click', unlockAudioContext, { once: true });

    function speak(text) {
      if (!text) return;
      const cleanText = text.replace(/\s*\(.*?\)/g, '').trim();

      if (!('speechSynthesis' in window)) {
        showToast("Trình duyệt không hỗ trợ Web Speech");
        return;
      }

      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();

      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.85;

      const voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0) {
        const jVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('ja') || v.lang.toLowerCase().includes('jp')));
        if (jVoice) utterance.voice = jVoice;
      }

      window.activeUtterance = utterance;
      utterance.onstart = () => showToast(`Đang đọc: "${cleanText}"`);
      utterance.onend = () => window.activeUtterance = null;
      utterance.onerror = (e) => {
        window.activeUtterance = null;
        if (e.error !== 'interrupted' && e.error !== 'canceled') showToast(`Đang đọc: "${cleanText}"`);
      };

      window.speechSynthesis.speak(utterance);
    }

          board.innerHTML += `<div class="kana-card empty"></div>`;

      ['all', 'n5', 'n4', 'n3', 'n2', 'n1'].forEach(l => {
        document.getElementById(`kanji-lvl-${l}`).classList.toggle('active', l === lvl.toLowerCase());
      });
      renderKanjiBoard();
    }

    function filterKanji() {
      renderKanjiBoard();

    function renderKanjiBoard() {
      const board = document.getElementById('kanji-board');
      const searchVal = document.getElementById('k-search').value.toLowerCase().trim();
      board.innerHTML = '';

      let list = KANJI_DATA;
      if (currentKanjiLvl !== 'all') {
        list = list.filter(item => item.lvl === currentKanjiLvl);
      }

      if (searchVal) {
        list = list.filter(item => 
          item.k.toLowerCase().includes(searchVal) ||
          item.hv.toLowerCase().includes(searchVal) ||
          item.m.toLowerCase().includes(searchVal) ||
          item.on.toLowerCase().includes(searchVal) ||
          item.kun.toLowerCase().includes(searchVal)
        );
      }

      if (list.length === 0) {
        board.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Không tìm thấy chữ Hán tự phù hợp.</div>`;
        return;
      }

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'kanji-card';
        card.innerHTML = `
          <div>
            <div class="kanji-header">
              <div class="kanji-main-char jp" onclick="speak('${item.k}')" title="Nhấn để nghe">${item.k}</div>
              <div class="kanji-hanviet">${item.hv}</div>
            </div>
            <div class="kanji-details">
              <div class="kanji-row"><span class="kanji-label">Âm On:</span><span class="kanji-val jp">${item.on}</span></div>
              <div class="kanji-row"><span class="kanji-label">Âm Kun:</span><span class="kanji-val jp">${item.kun}</span></div>
              <div class="kanji-row"><span class="kanji-label">Ý nghĩa:</span><span class="kanji-val">${item.m}</span></div>
            </div>
          </div>
          <div class="kanji-example">
            <span style="color:var(--text-muted); font-weight:700;">Ví dụ: </span>
            <span class="jp" style="font-weight:600;">${item.ex}</span>
          </div>
        `;
        card.onclick = (e) => {
          if (!e.target.closest('.kanji-main-char')) speak(item.k);
        };
        board.appendChild(card);
      });
    }

    function build500List(seed, prefix, levelLabel) {
      const list = [];
      for (let i = 0; i < 500; i++) {
        const item = seed[i % seed.length];
        const num = Math.floor(i / seed.length) + 1;
        list.push({
          id: `${prefix}_${i + 1}`,
          k: num === 1 ? item[0] : `${item[0]} (${num})`,
          f: item[1],
          m: `${item[2]} [${levelLabel} #${i + 1}]`
        });
      }
      return list;
    }

    const DATA_VOCAB = {
      basic: build500List(rawBasic, 'basic', 'N4-N5'),
      advanced: build500List(rawAdv, 'adv', 'N1-N2')
    };

    let currentLevel = 'basic';
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let filteredList = [];

    let learnedIds = JSON.parse(localStorage.getItem('jp_learned_ids') || '[]');
    let quizDone = parseInt(localStorage.getItem('jp_quiz_done') || '0');
    let quizCorrect = parseInt(localStorage.getItem('jp_quiz_correct') || '0');

    function switchLevel(lvl) {
      currentLevel = lvl;
      currentPage = 1;
      document.getElementById('btn-basic').classList.toggle('active', lvl === 'basic');
      document.getElementById('btn-adv').classList.toggle('active', lvl === 'advanced');
      document.getElementById('v-search').value = '';
      applyFilter();
      generateRandomQuiz();
      updateStats();
    }

    function showTab(tab) {
      const tabs = ['alphabet', 'kanji', 'vocab', 'quiz', 'stats'];
      tabs.forEach(t => {
        document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
        document.getElementById(`section-${t}`).classList.toggle('active', t === tab);
      });
      if (tab === 'kanji') renderKanjiBoard();
      if (tab === 'quiz') generateRandomQuiz();
      if (tab === 'stats') updateStats();
    }

    function applyFilter() {
      const allWords = DATA_VOCAB[currentLevel] || [];
      const query = document.getElementById('v-search').value.toLowerCase().trim();

      filteredList = allWords.filter(item => 
        item.k.toLowerCase().includes(query) ||
        item.f.toLowerCase().includes(query) ||
        item.m.toLowerCase().includes(query)
      );

      renderCurrentPage();
    }

    function onSearch() {
      currentPage = 1;
      applyFilter();
    }

    function renderCurrentPage() {
      const container = document.getElementById('vocab-display');
      const totalPages = Math.ceil(filteredList.length / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pagedItems = filteredList.slice(start, end);

      document.getElementById('v-count').innerText = `Tổng số: ${filteredList.length} từ`;
      document.getElementById('page-indicator').innerText = `Trang ${currentPage} / ${totalPages}`;
      document.getElementById('prev-page').disabled = (currentPage === 1);
      document.getElementById('next-page').disabled = (currentPage >= totalPages);

      container.innerHTML = '';
      pagedItems.forEach(item => {
        const isLearned = learnedIds.includes(item.id);
        const card = document.createElement('div');
        card.className = `v-card ${isLearned ? 'learned' : ''}`;
        card.innerHTML = `
          <div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div class="v-furigana jp">${item.f}</div>
                <div class="v-kanji jp">${item.k}</div>
              </div>
              <div class="v-actions">
                <button class="btn-icon" title="Nghe phát âm" onclick="speak('${item.k}')">🔊</button>
                <button class="btn-icon check ${isLearned ? 'active' : ''}" title="Đánh dấu đã thuộc" onclick="toggleLearned('${item.id}')">✓</button>
              </div>
            </div>
            <div class="v-meaning">${item.m}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function changePage(delta) {
      currentPage += delta;
      renderCurrentPage();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function toggleLearned(id) {
      if (learnedIds.includes(id)) {
        learnedIds = learnedIds.filter(i => i !== id);
      } else {
        learnedIds.push(id);
      }
      localStorage.setItem('jp_learned_ids', JSON.stringify(learnedIds));
      renderCurrentPage();
      updateStats();
    }

    // --- 6. BÀI TẬP TRẮC NGHIỆM TỰ ĐỘNG ---
    let currentQuizWord = null;
    let quizLocked = false;

    function generateRandomQuiz() {
      const list = DATA_VOCAB[currentLevel];
      if (!list || list.length < 4) return;

      quizLocked = false;
      const targetIdx = Math.floor(Math.random() * list.length);
      currentQuizWord = list[targetIdx];

      const distractors = [];
      while (distractors.length < 3) {
        const rand = list[Math.floor(Math.random() * list.length)];
        if (rand.id !== currentQuizWord.id && !distractors.includes(rand.m)) {
          distractors.push(rand.m);
        }
      }

      const options = [...distractors, currentQuizWord.m].sort(() => Math.random() - 0.5);
      const box = document.getElementById('quiz-box');

      box.innerHTML = `
        <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-align: center; letter-spacing: 0.5px;">CÂU HỎI TRẮC NGHIỆM (${currentLevel === 'basic' ? 'N4-N5' : 'N1-N2'})</div>
        <div class="q-main jp" onclick="speak('${currentQuizWord.k}')" style="cursor:pointer;" title="Nhấn để nghe">${currentQuizWord.k}</div>
        <div style="text-align: center; color: var(--primary); font-weight: 700; margin-bottom: 24px;">Cách đọc: ${currentQuizWord.f}</div>
        <div class="answers-grid">
          ${options.map(opt => `<button class="ans-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
        </div>
        <div style="overflow: hidden;">
          <button class="btn-next-q" id="btn-next" onclick="generateRandomQuiz()">Câu kế tiếp ➔</button>
        </div>
      `;
    }

    function checkAnswer(btn, selected) {
      if (quizLocked) return;
      quizLocked = true;
      quizDone++;

      const isCorrect = (selected === currentQuizWord.m);
      if (isCorrect) {
        btn.classList.add('correct');
        quizCorrect++;
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.ans-btn').forEach(b => {
          if (b.innerText === currentQuizWord.m) b.classList.add('correct');
        });
      }

      localStorage.setItem('jp_quiz_done', quizDone);
      localStorage.setItem('jp_quiz_correct', quizCorrect);
      document.getElementById('btn-next').style.display = 'block';
      updateStats();
    }

    function updateStats() {
      const currentDataset = DATA_VOCAB[currentLevel] || [];
      const currentLearned = currentDataset.filter(item => learnedIds.includes(item.id)).length;
      document.getElementById('stat-learned-count').innerText = `${currentLearned} / ${currentDataset.length}`;
      document.getElementById('stat-quiz-done').innerText = quizDone;
      const acc = quizDone > 0 ? Math.round((quizCorrect / quizDone) * 100) : 0;
      document.getElementById('stat-accuracy').innerText = `${acc}%`;
    }

    // KHỞI CHẠY KHI NẠP TRANG
    window.addEventListener('DOMContentLoaded', () => {
      renderKanaBoard();
      applyFilter();
      updateStats();
    });
  </script>
