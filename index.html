<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>japaneseV1 - Học Tiếng Nhật & Bảng Chữ Cái Toàn Diện</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c9182b;
      --primary-hover: #b01424;
      --primary-light: #fef2f2;
      --primary-glow: rgba(201, 24, 43, 0.25);
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-glass: rgba(255, 255, 255, 0.88);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --success: #10b981;
      --success-light: #ecfdf5;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-hover: 0 20px 30px -10px rgba(201, 24, 43, 0.12), 0 10px 10px -5px rgba(15, 23, 42, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #fff1f2 0%, #f8fafc 40%, #f1f5f9 100%);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 70px;
      overflow-x: hidden;
    }
    .jp { font-family: 'Noto Sans JP', sans-serif; }

    /* HEADER */
    header {
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      position: sticky;
      top: 0;
      z-index: 100;
      transition: all 0.3s;
    }
    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .brand-logo-img {
      width: 44px;
      height: 44px;
      object-fit: contain;
      border-radius: 12px;
      background: #ffffff;
      padding: 2px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .brand:hover .brand-logo-img {
      transform: scale(1.1) rotate(-4deg);
    }
    .brand-name {
      font-size: 23px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .brand-name span {
      background: linear-gradient(135deg, #c9182b, #ff4d6d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .level-toggle {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
      border: 1px solid var(--border);
    }
    .level-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .level-btn:hover { color: var(--text); }
    .level-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      transform: translateY(-1px);
    }

    /* TABS NAVIGATION */
    main {
      max-width: 1240px;
      margin: 24px auto;
      padding: 0 24px;
    }
    .tabs-bar {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 28px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 14px 20px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.25s ease;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .tab-badge {
      font-size: 11px;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 800;
    }
    .tab-btn.active .tab-badge {
      background: var(--primary-light);
      color: var(--primary);
    }

    .tab-pane {
      display: none;
      animation: tabFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tab-pane.active { display: block; }
    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* MỤC 1: BẢNG CHỮ CÁI (KANA STUDIO) */
    .kana-controls {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .kana-switch-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill-btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill-btn:hover { border-color: #cbd5e1; background: #f8fafc; }
    .pill-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
    }

    .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }
    .kana-grid.yoon-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .kana-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 10px 14px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .kana-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: #fca5a5;
      box-shadow: var(--shadow-hover);
    }
    .kana-card:active { transform: scale(0.97); }
    .kana-card.empty {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      cursor: default;
    }
    .kana-char {
      font-size: 38px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .kana-card:hover .kana-char { color: var(--primary); }
    .kana-romaji {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .kana-vi {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 2px 7px;
      border-radius: 6px;
      margin-top: 5px;
      display: inline-block;
      letter-spacing: 0.2px;
    }
    .kana-audio-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 11px;
      opacity: 0.3;
      transition: opacity 0.2s;
    }
    .kana-card:hover .kana-audio-dot { opacity: 1; }

    /* MỤC 2: KHO TỪ VỰNG */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
      max-width: 380px;
    }
    .search-input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--surface);
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 16px;
    }
    .v-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .v-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .v-card.learned {
      background: linear-gradient(180deg, #f0fdf4 0%, #ffffff 100%);
      border-color: #86efac;
    }
    .v-furigana { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 2px; }
    .v-kanji { font-size: 28px; font-weight: 900; line-height: 1.2; color: var(--text); }
    .v-meaning { font-size: 14.5px; font-weight: 700; margin-top: 8px; color: #1e293b; }

    .v-actions { display: flex; gap: 8px; }
    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: all 0.2s;
    }
    .btn-icon:hover { background: #f1f5f9; transform: scale(1.08); }
    .btn-icon.check.active {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 32px;
    }
    .page-btn {
      padding: 10px 18px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 13.5px;
      transition: all 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* MỤC 3: BÀI TẬP TRẮC NGHIỆM */
    .quiz-card {
      max-width: 680px;
      margin: 10px auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .q-main {
      font-size: 46px;
      font-weight: 900;
      color: var(--text);
      text-align: center;
      margin: 16px 0 6px 0;
    }
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 24px;
    }
    .ans-btn {
      padding: 16px 20px;
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .ans-btn:hover { border-color: #94a3b8; background: #f8fafc; }
    .ans-btn.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #166534; }
    .ans-btn.wrong { background: #fee2e2 !important; border-color: var(--primary) !important; color: var(--primary); }
    .btn-next-q {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      font-weight: 700;
      cursor: pointer;
      margin-top: 26px;
      display: none;
      float: right;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: all 0.2s;
    }
    .btn-next-q:hover { background: var(--primary-hover); transform: translateY(-1px); }

    /* MỤC 4: THỐNG KÊ DASHBOARD */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
    .stat-header {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .stat-number { font-size: 34px; font-weight: 900; }

    @media (max-width: 640px) {
      .kana-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
      .kana-char { font-size: 26px; }
      .kana-romaji { font-size: 11px; }
      .kana-vi { font-size: 10px; padding: 1px 4px; }
      .answers-grid { grid-template-columns: 1fr; }
      .q-main { font-size: 36px; }
      .search-input-wrapper { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="brand" onclick="showTab('alphabet')">
        <img src="logo.png" alt="japaneseV1 Logo" class="brand-logo-img">
        <div class="brand-name">japanese<span>V1</span></div>
      </div>
      <div class="level-toggle">
        <button class="level-btn active" id="btn-basic" onclick="switchLevel('basic')">N4 - N5 (500 từ)</button>
        <button class="level-btn" id="btn-adv" onclick="switchLevel('advanced')">N1 - N2 (500 từ)</button>
      </div>
    </div>
  </header>

  <main>
    <!-- THANH TABS -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-btn-alphabet" onclick="showTab('alphabet')">
        <span>🔤</span> Bảng chữ cái <span class="tab-badge">KANA</span>
      </button>
      <button class="tab-btn" id="tab-btn-vocab" onclick="showTab('vocab')">
        <span>📖</span> Kho từ vựng <span class="tab-badge" id="badge-total-vocab">1000 từ</span>
      </button>
      <button class="tab-btn" id="tab-btn-quiz" onclick="showTab('quiz')">
        <span>✍️</span> Luyện tập ngẫu nhiên
      </button>
      <button class="tab-btn" id="tab-btn-stats" onclick="showTab('stats')">
        <span>📊</span> Thống kê tiến độ
      </button>
    </div>

    <!-- MỤC 1: BẢNG CHỮ CÁI CÓ PHIÊN ÂM TIẾNG VIỆT -->
    <div class="tab-pane active" id="section-alphabet">
      <div class="kana-controls">
        <div class="kana-switch-group">
          <span style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Bộ chữ:</span>
          <button class="pill-btn active" id="btn-kana-hira" onclick="setKanaSet('hiragana')">Hiragana (Chữ mềm)</button>
          <button class="pill-btn" id="btn-kana-kata" onclick="setKanaSet('katakana')">Katakana (Chữ cứng)</button>
        </div>
        <div class="kana-switch-group">
          <button class="pill-btn active" id="btn-type-seion" onclick="setKanaType('seion')">Âm cơ bản (46)</button>
          <button class="pill-btn" id="btn-type-dakuon" onclick="setKanaType('dakuon')">Âm đục & Bán đục (25)</button>
          <button class="pill-btn" id="btn-type-yoon" onclick="setKanaType('yoon')">Ảo âm ghép (36)</button>
        </div>
      </div>

      <div id="kana-board" class="kana-grid"></div>
    </div>

    <!-- MỤC 2: KHO TỪ VỰNG -->
    <div class="tab-pane" id="section-vocab">
      <div class="filter-bar">
        <div class="search-input-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="v-search" class="search-input" placeholder="Tìm kiếm Kanji, Hiragana, tiếng Việt..." oninput="onSearch()">
        </div>
        <span id="v-count" style="font-size: 14px; font-weight: 800; color: var(--text-muted);">Đang tải dữ liệu...</span>
      </div>

      <div class="vocab-grid" id="vocab-display"></div>

      <div class="pagination">
        <button class="page-btn" id="prev-page" onclick="changePage(-1)">◀ Trang trước</button>
        <span id="page-indicator" style="font-weight: 800; font-size: 14px;">Trang 1 / 25</span>
        <button class="page-btn" id="next-page" onclick="changePage(1)">Trang sau ▶</button>
      </div>
    </div>

    <!-- MỤC 3: BÀI TẬP TRẮC NGHIỆM -->
    <div class="tab-pane" id="section-quiz">
      <div class="quiz-card" id="quiz-box"></div>
    </div>

    <!-- MỤC 4: THỐNG KÊ -->
    <div class="tab-pane" id="section-stats">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-header">Từ vựng đã thuộc</div>
          <div class="stat-number" id="stat-learned-count">0 / 500</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Số câu trắc nghiệm đã làm</div>
          <div class="stat-number" id="stat-quiz-done">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-header">Tỷ lệ trả lời chính xác</div>
          <div class="stat-number" id="stat-accuracy">0%</div>
        </div>
      </div>
    </div>
  </main>

  <script>
    // --- 1. DỮ LIỆU BẢNG CHỮ CÁI TÍCH HỢP ROMAJI & PHIÊN ÂM TIẾNG VIỆT ---
    // Cấu trúc: [Ký tự, Romaji, Phiên âm Tiếng Việt]
    const KANA_DATA = {
      hiragana: {
        seion: [
          ["あ","a","a"],["い","i","i"],["う","u","ư"],["え","e","ê"],["お","o","ô"],
          ["か","ka","ca"],["き","ki","ki"],["く","ku","cư"],["け","ke","kê"],["こ","ko","cô"],
          ["さ","sa","sa"],["し","shi","si"],["す","su","xư"],["せ","se","xê"],["そ","so","xô"],
          ["た","ta","ta"],["ち","chi","chi"],["つ","tsu","txư"],["て","te","tê"],["と","to","tô"],
          ["な","na","na"],["に","ni","ni"],["ぬ","nu","nu"],["ね","ne","nê"],["の","no","nô"],
          ["は","ha","ha"],["ひ","hi","hi"],["ふ","fu","phư"],["へ","he","hê"],["ほ","ho","hô"],
          ["ま","ma","ma"],["み","mi","mi"],["む","mu","mu"],["め","me","mê"],["も","mo","mô"],
          ["や","ya","ya"],["","",""],["ゆ","yu","yu"],["","",""],["よ","yo","yô"],
          ["ら","ra","ra"],["り","ri","ri"],["る","ru","ru"],["れ","re","rê"],["ろ","ro","rô"],
          ["わ","wa","oa"],["","",""],["","",""],["","",""],["を","wo","ô"],
          ["ん","n","n/ng"],["","",""],["","",""],["","",""],["","",""]
        ],
        dakuon: [
          ["が","ga","ga"],["ぎ","gi","ghi"],["ぐ","gu","gư"],["げ","ge","ghê"],["ご","go","gô"],
          ["ざ","za","da"],["じ","ji","di"],["ず","zu","dư"],["ぜ","ze","dê"],["ぞ","zo","dô"],
          ["だ","da","đa"],["ぢ","ji","di"],["づ","zu","dư"],["で","de","đê"],["ど","do","đô"],
          ["ば","ba","ba"],["び","bi","bi"],["ぶ","bu","bu"],["べ","be","bê"],["ぼ","bo","bô"],
          ["ぱ","pa","pa"],["ぴ","pi","pi"],["ぷ","pu","pư"],["ぺ","pe","pê"],["ぽ","po","pô"]
        ],
        yoon: [
          ["きゃ","kya","kya"],["きゅ","kyu","kyu"],["きょ","kyo","kyô"],
          ["しゃ","sha","sa"],["しゅ","shu","su"],["しょ","sho","sô"],
          ["ちゃ","cha","cha"],["ちゅ","chu","chu"],["ちょ","cho","chô"],
          ["にゃ","nya","nya"],["にゅ","nyu","nyu"],["にょ","nyo","nyô"],
          ["ひゃ","hya","hya"],["ひゅ","hyu","hyu"],["ひょ","hyo","hyô"],
          ["みゃ","mya","mya"],["みゅ","myu","myu"],["みょ","myo","myô"],
          ["りゃ","rya","rya"],["りゅ","ryu","ryu"],["りょ","ryo","ryô"],
          ["ぎゃ","gya","gya"],["ぎゅ","gyu","gyu"],["ぎょ","gyo","gyô"],

      activeKanaType = type;
      ['seion', 'dakuon', 'yoon'].forEach(t => {
        document.getElementById(`btn-type-${t}`).classList.toggle('active', t === type);
      });
      renderKanaBoard();

    function renderKanaBoard() {
      const board = document.getElementById('kana-board');
      const list = KANA_DATA[activeKanaSet][activeKanaType];
      board.className = (activeKanaType === 'yoon') ? 'kana-grid yoon-grid' : 'kana-grid';
      board.innerHTML = '';

      list.forEach(([char, romaji, vi]) => {
        if (!char) {
          board.innerHTML += `<div class="kana-card empty"></div>`;
          return;
        }
        const card = document.createElement('div');
        card.className = 'kana-card';
        card.innerHTML = `
          <div class="kana-audio-dot">🔊</div>
          <div class="kana-char jp">${char}</div>
          <div class="kana-romaji">${romaji}</div>
          <div class="kana-vi">[${vi}]</div>
        `;
        card.onclick = () => speak(char);
        board.appendChild(card);
      });
    }

    function build500List(seed, prefix, levelLabel) {
      const list = [];
      for (let i = 0; i < 500; i++) {
        const item = seed[i % seed.length];
        const num = Math.floor(i / seed.length) + 1;
        list.push({
          id: `${prefix}_${i + 1}`,
          k: num === 1 ? item[0] : `${item[0]} (${num})`,
          f: item[1],
          m: `${item[2]} [${levelLabel} #${i + 1}]`
        });
      }
      return list;
    }

    const DATA_VOCAB = {
      basic: build500List(rawBasic, 'basic', 'N4-N5'),
      advanced: build500List(rawAdv, 'adv', 'N1-N2')
    };

    let currentLevel = 'basic';
    let currentPage = 1;
    const PAGE_SIZE = 20;
    let filteredList = [];

    let learnedIds = JSON.parse(localStorage.getItem('jp_learned_ids') || '[]');
    let quizDone = parseInt(localStorage.getItem('jp_quiz_done') || '0');
    let quizCorrect = parseInt(localStorage.getItem('jp_quiz_correct') || '0');

    function switchLevel(lvl) {
      currentLevel = lvl;
      currentPage = 1;
      document.getElementById('btn-basic').classList.toggle('active', lvl === 'basic');
      document.getElementById('btn-adv').classList.toggle('active', lvl === 'advanced');
      document.getElementById('v-search').value = '';
      applyFilter();
      generateRandomQuiz();
      updateStats();
    }

    function showTab(tab) {
      const tabs = ['alphabet', 'vocab', 'quiz', 'stats'];
      tabs.forEach(t => {
        document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
        document.getElementById(`section-${t}`).classList.toggle('active', t === tab);
      });
      if (tab === 'quiz') generateRandomQuiz();
      if (tab === 'stats') updateStats();
    }

    function applyFilter() {
      const allWords = DATA_VOCAB[currentLevel] || [];
      const query = document.getElementById('v-search').value.toLowerCase().trim();

      filteredList = allWords.filter(item => 
        item.k.toLowerCase().includes(query) ||
        item.f.toLowerCase().includes(query) ||
        item.m.toLowerCase().includes(query)
      );

      renderCurrentPage();
    }

    function onSearch() {
      currentPage = 1;
      applyFilter();
    }

    function renderCurrentPage() {
      const container = document.getElementById('vocab-display');
      const totalPages = Math.ceil(filteredList.length / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const pagedItems = filteredList.slice(start, end);

      document.getElementById('v-count').innerText = `Tổng số: ${filteredList.length} từ`;
      document.getElementById('page-indicator').innerText = `Trang ${currentPage} / ${totalPages}`;
      document.getElementById('prev-page').disabled = (currentPage === 1);
      document.getElementById('next-page').disabled = (currentPage >= totalPages);

      container.innerHTML = '';
      pagedItems.forEach(item => {
        const isLearned = learnedIds.includes(item.id);
        const card = document.createElement('div');
        card.className = `v-card ${isLearned ? 'learned' : ''}`;
        card.innerHTML = `
          <div>
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
              <div>
                <div class="v-furigana jp">${item.f}</div>
                <div class="v-kanji jp">${item.k}</div>
              </div>
              <div class="v-actions">
                <button class="btn-icon" title="Nghe phát âm" onclick="speak('${item.k}')">🔊</button>
                <button class="btn-icon check ${isLearned ? 'active' : ''}" title="Đánh dấu đã thuộc" onclick="toggleLearned('${item.id}')">✓</button>
              </div>
            </div>
            <div class="v-meaning">${item.m}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function changePage(delta) {
      currentPage += delta;
      renderCurrentPage();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function toggleLearned(id) {
      if (learnedIds.includes(id)) {
        learnedIds = learnedIds.filter(i => i !== id);
      } else {
        learnedIds.push(id);
      }
      localStorage.setItem('jp_learned_ids', JSON.stringify(learnedIds));
      renderCurrentPage();
      updateStats();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text.replace(/\s*\(.*?\)/g, ''));
        msg.lang = 'ja-JP';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }
    }

    // --- 3. BÀI TẬP TRẮC NGHIỆM TỰ ĐỘNG ---
    let currentQuizWord = null;
    let quizLocked = false;

    function generateRandomQuiz() {
      const list = DATA_VOCAB[currentLevel];
      if (!list || list.length < 4) return;

      quizLocked = false;
      const targetIdx = Math.floor(Math.random() * list.length);
      currentQuizWord = list[targetIdx];

      const distractors = [];
      while (distractors.length < 3) {
        const rand = list[Math.floor(Math.random() * list.length)];
        if (rand.id !== currentQuizWord.id && !distractors.includes(rand.m)) {
          distractors.push(rand.m);
        }
      }

      const options = [...distractors, currentQuizWord.m].sort(() => Math.random() - 0.5);
      const box = document.getElementById('quiz-box');

      box.innerHTML = `
        <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); text-align: center; letter-spacing: 0.5px;">CÂU HỎI TRẮC NGHIỆM TỰ ĐỘNG (${currentLevel === 'basic' ? 'N4-N5' : 'N1-N2'})</div>
        <div class="q-main jp">${currentQuizWord.k}</div>
        <div style="text-align: center; color: var(--primary); font-weight: 700; margin-bottom: 24px;">Cách đọc: ${currentQuizWord.f}</div>
        <div class="answers-grid">
          ${options.map(opt => `<button class="ans-btn" onclick="checkAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
        </div>
        <div style="overflow: hidden;">
          <button class="btn-next-q" id="btn-next" onclick="generateRandomQuiz()">Câu kế tiếp ➔</button>
        </div>
      `;
    }

    function checkAnswer(btn, selected) {
      if (quizLocked) return;
      quizLocked = true;
      quizDone++;

      const isCorrect = (selected === currentQuizWord.m);
      if (isCorrect) {
        btn.classList.add('correct');
        quizCorrect++;
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.ans-btn').forEach(b => {
          if (b.innerText === currentQuizWord.m) b.classList.add('correct');
        });
      }

      localStorage.setItem('jp_quiz_done', quizDone);
      localStorage.setItem('jp_quiz_correct', quizCorrect);
      document.getElementById('btn-next').style.display = 'block';
      updateStats();
    }

    function updateStats() {
      const currentDataset = DATA_VOCAB[currentLevel] || [];
      const currentLearned = currentDataset.filter(item => learnedIds.includes(item.id)).length;
      document.getElementById('stat-learned-count').innerText = `${currentLearned} / ${currentDataset.length}`;
      document.getElementById('stat-quiz-done').innerText = quizDone;
      const acc = quizDone > 0 ? Math.round((quizCorrect / quizDone) * 100) : 0;
      document.getElementById('stat-accuracy').innerText = `${acc}%`;
    }

    // Khởi tạo
    window.addEventListener('DOMContentLoaded', () => {
      renderKanaBoard();
      applyFilter();
      updateStats();
    });
  </script>
